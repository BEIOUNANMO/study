<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>乐清语文 · 2027 备考台</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--navy:#1f3a5f;--navy2:#2e4f7a;--red:#b02a2a;--bg:#f4f6fa;--card:#fff;--line:#e3e8f0;--txt:#1c2430;--mut:#6b7787;--ok:#1f7a4d;--warn:#b7791f}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;padding-bottom:70px}
.wrap{max-width:860px;margin:0 auto;padding:0 14px}
.hero{background:linear-gradient(150deg,#1f3a5f,#2e4f7a 55%,#3b628f);color:#fff;padding:18px 0 22px;border-radius:0 0 22px 22px;box-shadow:0 6px 20px rgba(31,58,95,.18)}
.hero-top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;opacity:.92}
.brand{letter-spacing:.5px}
.streak{background:rgba(255,255,255,.16);padding:3px 10px;border-radius:20px}
.count{display:flex;align-items:baseline;gap:6px;margin-top:10px}
.count b{font-size:52px;line-height:1;font-weight:800;letter-spacing:-2px}
.count span{font-size:14px;opacity:.85}
.count-label{font-size:13px;opacity:.82;margin-top:2px}
.chips{display:flex;gap:8px;margin-top:14px;overflow-x:auto;padding-bottom:2px}
.chip{flex:0 0 auto;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);padding:6px 11px;border-radius:12px;font-size:12px;white-space:nowrap}
.chip b{font-weight:700}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;text-align:center;padding:9px 0 8px;font-size:11.5px;color:var(--mut);cursor:pointer}
.tab.on{color:var(--navy);font-weight:700}
.tab i{display:block;font-size:19px;font-style:normal;line-height:1.2}
.sec{display:none;padding-top:16px}
.sec.on{display:block}
.card{background:var(--card);border-radius:16px;padding:15px 16px;margin:0 0 12px;box-shadow:0 1px 3px rgba(16,24,40,.05),0 8px 24px -18px rgba(16,24,40,.2)}
.card h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .dot{width:7px;height:7px;border-radius:50%;background:var(--navy)}
.card h3 .tag{margin-left:auto;font-size:11px;font-weight:400;color:var(--mut)}
.task{font-size:14.5px;line-height:1.7;color:#22303f}
.meta{font-size:12.5px;color:var(--mut);margin-top:6px}
.btns{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fbfcfe;color:#33445a;padding:7px 13px;border-radius:10px;font-size:13px;cursor:pointer;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.part.on{background:var(--warn);border-color:var(--warn)}
.btn.miss.on{background:var(--red);border-color:var(--red)}
.datebar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.datebar input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:12px;font-size:14px;background:#fff;color:var(--txt)}
.small{font-size:12px;color:var(--mut)}
.note{width:100%;min-height:64px;border:1px solid var(--line);border-radius:12px;padding:10px;font:14px/1.6 inherit;resize:vertical;background:#fbfcfe}
.quiz10{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0 6px}
.q{height:58px;border:1px solid var(--line);border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;font-size:15px;font-weight:700;color:#9aa6b5;background:#fbfcfe;cursor:pointer;user-select:none}
.q b{font-size:14px}
.q i{font-style:normal;font-size:10px;font-weight:600;opacity:.72;letter-spacing:.5px}
.q.ok{background:#e9f6ef;border-color:#1f7a4d;color:#1f7a4d}
.q.no{background:#fdecec;border-color:#b02a2a;color:#b02a2a}
.qrow{display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-size:21px;font-weight:800;color:var(--navy);letter-spacing:.5px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.row:last-child{border-bottom:0}
.row b{font-weight:700}
.pbar{height:8px;background:#e8edf5;border-radius:6px;overflow:hidden;margin:8px 0}
.pbar span{display:block;height:100%;background:linear-gradient(90deg,#2e4f7a,#4a7ab0);border-radius:6px;transition:.3s}
.filter{display:flex;gap:8px;margin:0 0 12px;overflow-x:auto}
.f{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:20px;font-size:12.5px;white-space:nowrap;cursor:pointer}
.f.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.wk{border-left:3px solid var(--navy);padding:10px 12px;margin-bottom:10px;background:#fff;border-radius:0 12px 12px 0}
.wk h4{margin:0 0 4px;font-size:14px}
.wk .l{font-size:13px;color:#3a4a5e;margin:2px 0}
.wk .t{font-size:12px;color:var(--mut)}
.wk.r2{border-color:#b7791f}.wk.r3{border-color:#2f7d4f}.wk.r4{border-color:#b02a2a}
.pl{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #eef2f7;font-size:13.5px}
.pl input{width:19px;height:19px;accent-color:#1f3a5f}
.pl .n{color:var(--mut);font-size:12px;width:30px;flex:0 0 auto}
.pl .t2{flex:1}
.pl .f2{color:var(--mut);font-size:12px;font-weight:400}
.pl.done .t2{text-decoration:line-through;color:#9aa6b5}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px 6px;border-bottom:1px solid #eef2f7;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:11.5px}
.badge{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11px;background:#eef3fa;color:#2e4f7a}
.badge.j{background:#fff4e0;color:#8a5a00}
.badge.z{background:#fdecec;color:#9b2020}
.bars{display:flex;align-items:flex-end;gap:5px;height:76px;margin:10px 0 4px}
.bars div{flex:1;background:#dbe5f2;border-radius:5px 5px 0 0;min-height:3px}
.bars div.h{background:linear-gradient(180deg,#4a7ab0,#2e4f7a)}
.empty{color:var(--mut);text-align:center;padding:26px 0;font-size:13.5px}
h2.pt{font-size:16px;margin:4px 0 10px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.kpi div{background:#fff;border-radius:14px;padding:12px 8px;text-align:center;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.kpi b{display:block;font-size:22px;color:var(--navy)}
.kpi span{font-size:11.5px;color:var(--mut)}
.foot{text-align:center;font-size:11.5px;color:#9aa6b5;padding:18px 0 6px}
@media(max-width:420px){.count b{font-size:44px}}
</style>
</head>
<body>
<div class="hero"><div class="wrap">
  <div class="hero-top"><span class="brand">乐清初中语文 · 2027 备考台</span><span class="streak" id="streak">🔥 0 天</span></div>
  <div class="count"><b id="cd">—</b><span>天</span></div>
  <div class="count-label" id="cdlbl">距 2027 社招笔试（7/11）</div>
  <div class="chips" id="chips"></div>

<div class="wrap">
  <div class="sec on" id="s-today">

      <div class="quiz10" id="qGrid"></div>

      </div>

    </div>
  </div>

  <div class="sec" id="s-plan">
    <div class="filter" id="pf"></div>
    <div id="planBox"></div>
  </div>

  <div class="sec" id="s-poem">
    <div class="card">
      <h3><span class="dot"></span>135 篇必背<span class="tag" id="ptag">0 / 135</span></h3>
      <div class="pbar"><span id="pbar" style="width:0%"></span></div>
      <div class="small">背会一首勾一首。晨读时打开，按小学→中学顺序。</div>
    </div>
    <div class="filter" id="gf"></div>
    <div class="card" id="poemBox"></div>
  </div>

  <div class="sec" id="s-mat">
    <div class="card">
      <h3><span class="dot"></span>材料索引</h3>
      <table id="matTable"></table>
    </div>
  </div>

  <div class="sec" id="s-stat">
    <div class="kpi" id="kpi"></div>
    <div class="small" id="qline" style="margin:-6px 0 12px 2px"></div>
    <div class="card">
      <h3><span class="dot"></span>最近 14 天</h3>
      <div class="bars" id="bars"></div>
      <div class="small" id="barsTip"></div>
    </div>
    <div class="card">
      <h3><span class="dot"></span>关键节点</h3>
      <div id="miles"></div>
    </div>
    <div class="card">
      <h3><span class="dot"></span>数据</h3>
      <div class="btns">
        <button class="btn" id="expBtn">导出进度</button>
        <button class="btn" id="impBtn">导入进度</button>
        <button class="btn miss" id="resetBtn">清空</button>
      </div>
      <div class="small" style="margin-top:8px">进度存在本机浏览器里，换设备用“导出/导入”搬。</div>
    </div>
  </div>
  <div class="foot">2027 乐清社招 · 34 周 · 238 天　|　每天三小时，不断链</div>
</div>

<div class="tabs">
  <div class="tab on" data-s="today"><i>◎</i>今日</div>
  <div class="tab" data-s="plan"><i>▤</i>计划</div>

  <div class="tab" data-s="mat"><i>▣</i>材料</div>

</div>

    b.onclick = () => {
      const d = b.dataset.d; S.days[d] = S.days[d] || {}; S.days[d].s = b.dataset.v; save(); renderToday(); header();
    };
  });
  renderQuiz(ds, day);
}

// ---- daily quiz ----
const QT = ['选择','选择','默写','简答','鉴赏','阅读','选择','选择','选择','辨析'];
let qtimer = null, qleft = 1500;
function stopT(){ if(qtimer){ clearInterval(qtimer); qtimer = null; } }
function fmtT(s){ return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }
function renderQuiz(ds, day){
  stopT(); qleft = 1500;
  const card = document.getElementById('quizCard');
  if(!day){ card.style.display = 'none'; return; }
  card.style.display = 'block';
  const st = S.days[ds] = S.days[ds] || {};
  if(!st.q) st.q = {r:[]};
  if(!st.q.r) st.q.r = [];
  document.getElementById('qSrc').innerHTML = '<b>语文 6 题</b>　选择2 · 默写1 · 简答1 · 鉴赏1 · 阅读1　← ' + day.yw + '<br><b>教基 4 题</b>　选择3 · 辨析1　← ' + day.jf;
  const g = document.getElementById('qGrid'); g.innerHTML = '';
  const refresh = () => {
    const rr = S.days[ds].q.r || [];
    const rt = rr.filter(x=>x===1).length;
    const bad = rr.filter(x=>x===2).length;
    document.getElementById('qScore').textContent = (rt+bad) ? ('对 ' + rt + '　错 ' + bad) : '未做';
    document.getElementById('qTip').textContent = (rt+bad) ? '点格子可改判：绿=对 红=错 灰=未做' : '做完一题点一格：绿=对 红=错';
  };
  for(let i=0;i<10;i++){
    const el = document.createElement('div');
    const v = S.days[ds].q.r[i] || 0;
    el.className = 'q' + (v===1?' ok':v===2?' no':'');
    el.innerHTML = '<b>' + (i+1) + '</b><i>' + QT[i] + '</i>';
    el.onclick = () => {
      const cur = S.days[ds].q.r[i] || 0;
      S.days[ds].q.r[i] = cur===0 ? 1 : cur===1 ? 2 : 0;
      el.className = 'q' + (S.days[ds].q.r[i]===1?' ok':S.days[ds].q.r[i]===2?' no':'');
      save(); refresh();
    };
    g.appendChild(el);
  }
  document.getElementById('qTimer').textContent = fmtT(qleft);
  refresh();
  const btn = document.getElementById('qStart');
  btn.textContent = '开始计时';
  btn.onclick = () => {
    if(qtimer){ stopT(); btn.textContent = '开始计时'; return; }
    btn.textContent = '暂停';
    qtimer = setInterval(() => {
      qleft--; if(qleft <= 0){ qleft = 0; stopT(); btn.textContent = '开始计时'; }
      document.getElementById('qTimer').textContent = fmtT(qleft);
    }, 1000);
  };
  document.getElementById('qReset').onclick = () => { stopT(); S.days[ds].q = {r:[]}; save(); renderQuiz(ds, day); };
}

// ---- plan ----
let pf = 'all';
function renderPlan(){
  const rounds = [['all','全部'],['P1 一轮','第一轮'],['P2 教资冲刺','第二轮'],['P3 面试+社招','第三轮'],['P4 社招套卷','第四轮'],['P5 考前','考前']];
  $('#pf').innerHTML = rounds.map(r=>`<div class="f ${pf===r[0]?'on':''}" data-r="${r[0]}">${r[1]}</div>`).join('');
  $('#pf').querySelectorAll('.f').forEach(f=>f.onclick=()=>{pf=f.dataset.r;renderPlan()});
  const list = D.weeks.filter(w=>pf==='all'||w.p===pf);
  $('#planBox').innerHTML = list.map(w=>{
    const cls = w.p.startsWith('P2')?'r2':w.p.startsWith('P3')?'r3':w.p.startsWith('P4')?'r4':'';
    return `<div class="wk ${cls}">
      <h4>W${w.n}　${w.s.slice(5)}—${w.e.slice(5)}　<span class="badge">${w.p}</span></h4>
      <div class="l"><b>语文：</b>${w.yw}</div>
      <div class="l"><b>教基：</b>${w.jf}</div>
      ${w.add?`<div class="l"><b>教资：</b>${w.add}</div>`:''}
      <div class="t">周测：${w.test}　｜　背诵：${w.mem}</div>
    </div>`;
  }).join('');
}

// ---- poems ----
let gf = 'all';
function renderPoems(){
  const done = D.poems.filter(p=>S.poems[p.seg+p.no]).length;
  $('#ptag').textContent = done + ' / ' + D.poems.length;
  $('#pbar').style.width = (done/D.poems.length*100).toFixed(1)+'%';
  $('#gf').innerHTML = [['all','全部'],['小学','小学 75'],['中学','中学 60']].map(g=>`<div class="f ${gf===g[0]?'on':''}" data-g="${g[0]}">${g[1]}</div>`).join('');
  $('#gf').querySelectorAll('.f').forEach(f=>f.onclick=()=>{gf=f.dataset.g;renderPoems()});
  const list = D.poems.filter(p=>gf==='all'||p.seg===gf);
  $('#poemBox').innerHTML = list.map(p=>{
    const k = p.seg+p.no, on = S.poems[k];
    return `<label class="pl ${on?'done':''}"><input type="checkbox" data-k="${k}" ${on?'checked':''}>
      <span class="n">${p.no}</span><span class="t2">《${p.t}》<span class="f2">　${p.f}</span></span></label>`;
  }).join('');
  $('#poemBox').querySelectorAll('input[data-k]').forEach(cb=>{
    cb.onchange = () => { S.poems[cb.dataset.k] = cb.checked; save(); renderPoems(); };
  });
}

// ---- materials ----
function renderMats(){
  const cls = t => t==='教基'?'j':t==='教资'?'z':'';
  $('#matTable').innerHTML = `<tr><th>科目</th><th>材料</th><th>范围</th><th>用途</th><th>何时</th></tr>` +
    D.mats.map(m=>`<tr><td><span class="badge ${cls(m[0])}">${m[0]}</span></td><td><b>${m[1]}</b></td><td>${m[2]}</td><td>${m[3]}</td><td class="small">${m[4]}</td></tr>`).join('');
}

// ---- stats ----
function renderStat(){
  const ds = Object.keys(S.days);
  const done = ds.filter(k=>S.days[k].s==='done').length;
  const part = ds.filter(k=>S.days[k].s==='part').length;
  const passed = D.days.filter(d=>d.d<=today()).length || 1;
  const rate = Math.round((done + part*0.5)/passed*100);
  const poems = D.poems.filter(p=>S.poems[p.seg+p.no]).length;
  $('#kpi').innerHTML = `<div><b>${rate}%</b><span>完成率</span></div><div><b>${done}</b><span>完成天</span></div><div><b>${poems}</b><span>背会篇</span></div>`;
  const qd = Object.keys(S.days).filter(k => S.days[k].q && (S.days[k].q.r||[]).length);
  let qright = 0;
  qd.forEach(k => qright += (S.days[k].q.r||[]).filter(x=>x===1).length);
  const qn = qd.length * 10;
  const ql = document.getElementById('qline');
  if(ql) ql.textContent = '每日10题：已做 ' + qn + ' 题，答对 ' + qright + ' 题，正确率 ' + (qn ? Math.round(qright/qn*100) : 0) + '%　（目标：第一轮 60% → 第三轮 80%）';
  const arr = [];
  for(let i=13;i>=0;i--){
    const d = new Date(Date.now()-i*DAYMS), k = fmt(d), st = (S.days[k]||{}).s;
    arr.push({k, v: st==='done'?1:st==='part'?0.5:0});
  }
  const max = Math.max(1, ...arr.map(a=>a.v));
  $('#bars').innerHTML = arr.map(a=>`<div class="${a.v>0?'h':''}" style="height:${Math.max(3,a.v/max*100)}%" title="${a.k}"></div>`).join('');
  $('#barsTip').textContent = '左起 14 天前 → 昨天。柱越高说明那天完成度越好。';
  $('#miles').innerHTML = D.miles.map(m=>{
    const d = cdTo(m.d);
    return `<div class="row"><span>${m.d.slice(5)}　${m.t}</span><b style="color:${d<0?'#9aa6b5':d<60?'#b02a2a':'#1f3a5f'}">${d<0?'已过':'还有 '+d+' 天'}</b></div>`;
  }).join('');
}

// ---- tabs ----
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.sec').forEach(x=>x.classList.remove('on'));
    t.classList.add('on'); $('#s-'+t.dataset.s).classList.add('on');
    if(t.dataset.s==='stat') renderStat();
    window.scrollTo({top:0,behavior:'smooth'});
  };
});
$('#date').onchange = renderToday;
$('#todayBtn').onclick = () => { $('#date').value = today(); renderToday(); };
$('#note').oninput = () => { const d=$('#date').value||today(); S.days[d]=S.days[d]||{}; S.days[d].note=$('#note').value; save(); };
$('#expBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'yq2027-进度.json'; a.click();
};
$('#impBtn').onclick = () => {
  const inp = document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange = () => { const f=inp.files[0]; if(!f) return; const r=new FileReader();
    r.onload = () => { try{ S = JSON.parse(r.result); save(); location.reload(); }catch(e){ alert('文件格式不对'); } };
    r.readAsText(f); };
  inp.click();
};
$('#resetBtn').onclick = () => { if(confirm('清空所有打卡和背诵记录？')){ S={days:{},poems:{}}; save(); location.reload(); } };

const q = new URLSearchParams(location.search);
$('#date').value = q.get('d') || today();
if(q.get('tab')){ const t=document.querySelector('.tab[data-s="'+q.get('tab')+'"]'); if(t) t.click(); }
header(); renderToday(); renderPlan(); renderPoems(); renderMats(); renderStat();
</script>
</body>
