<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>叶家宏 · 无论如何今年一定上岸</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="上岸">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--navy:#1f3a5f;--navy2:#2e4f7a;--red:#b02a2a;--bg:#f4f6fa;--card:#fff;--line:#e3e8f0;--txt:#1c2430;--mut:#6b7787;--ok:#1f7a4d;--warn:#b7791f}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
body{background:var(--bg);color:var(--txt);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;padding-bottom:72px}
.wrap{max-width:860px;margin:0 auto;padding:0 14px;width:100%}
.hero{background:linear-gradient(150deg,#1f3a5f,#2e4f7a 55%,#3b628f);color:#fff;padding:18px 0 22px;border-radius:0 0 22px 22px;box-shadow:0 6px 20px rgba(31,58,95,.18)}
.hero-top{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12.5px;opacity:.92}
.streak{background:rgba(255,255,255,.16);padding:3px 10px;border-radius:20px;flex:0 0 auto}
.slogan{min-width:0;font-weight:800;font-size:14px;letter-spacing:.3px;opacity:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{display:flex;align-items:baseline;gap:6px;margin-top:10px}
.count b{font-size:52px;line-height:1;font-weight:800;letter-spacing:-2px}
.count span{font-size:14px;opacity:.85}
.count-label{font-size:13px;opacity:.82;margin-top:2px}
.chips{display:flex;gap:8px;margin-top:14px;overflow-x:auto;padding-bottom:2px}
.chip{flex:0 0 auto;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);padding:6px 11px;border-radius:12px;font-size:12px;white-space:nowrap}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;text-align:center;padding:8px 0 7px;font-size:10.5px;color:var(--mut);cursor:pointer}
.tab.on{color:var(--navy);font-weight:700}
.tab i{display:block;font-size:17px;font-style:normal;line-height:1.25}
.sec{display:none;padding-top:16px}
.sec.on{display:block}
.card{background:var(--card);border-radius:16px;padding:15px 16px;margin:0 0 12px;box-shadow:0 1px 3px rgba(16,24,40,.05),0 8px 24px -18px rgba(16,24,40,.2)}
.card h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .dot{width:7px;height:7px;border-radius:50%;background:var(--navy)}
.card h3 .tag{margin-left:auto;font-size:11px;font-weight:400;color:var(--mut)}
.task{font-size:14.5px;line-height:1.7;color:#22303f}
.meta{font-size:12.5px;color:var(--mut);margin-top:6px}
.cmd{border:1.5px solid #e7c9c9;background:#fffafa}
.cmd h3 .dot{background:var(--red)}
.cmd-item{display:flex;gap:9px;padding:9px 0;border-bottom:1px dashed #f0dcdc;font-size:14px;line-height:1.6;cursor:pointer}
.cmd-item:last-child{border-bottom:0}
.cmd-item .bx{flex:0 0 auto;width:20px;height:20px;border:1.5px solid #d9a6a6;border-radius:6px;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.cmd-item.done .bx{background:var(--red);border-color:var(--red)}
.cmd-item.done .tx{color:#9aa6b5;text-decoration:line-through}
.bigbtn{display:block;width:100%;margin-top:12px;border:0;border-radius:13px;background:linear-gradient(135deg,#b02a2a,#cf3a3a);color:#fff;font-size:16px;font-weight:800;letter-spacing:4px;padding:14px 0;cursor:pointer;box-shadow:0 6px 16px -8px rgba(176,42,42,.8)}
.bigbtn.dis{background:#eef1f6;color:#9aa6b5;letter-spacing:1px;font-size:13.5px;font-weight:600;box-shadow:none;cursor:not-allowed;padding:12px 0}
.cmd-item .btn{margin-left:8px;flex:0 0 auto}
.pass{background:#e9f6ef;border:1px solid #bfe3cf;color:#1f7a4d;border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:700;text-align:center;margin-top:10px}
.low{background:#f7f8fb;border:1px dashed #d7dde8}
.low h3 .dot{background:#9aa6b5}
.btns{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fbfcfe;color:#33445a;padding:7px 13px;border-radius:10px;font-size:13px;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.part.on{background:var(--warn);border-color:var(--warn)}
.btn.miss.on{background:var(--red);border-color:var(--red)}
.btn.mini{padding:4px 9px;font-size:12px}
.datebar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.datebar input{flex:1;min-width:0;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:12px;font-size:14px;background:#fff;color:var(--txt)}
.small{font-size:12px;color:var(--mut)}
.note{width:100%;min-height:64px;border:1px solid var(--line);border-radius:12px;padding:10px;font:14px/1.6 inherit;resize:vertical;background:#fbfcfe}
.quiz10{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0 6px}
.q{height:58px;border:1px solid var(--line);border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;font-size:15px;font-weight:700;color:#9aa6b5;background:#fbfcfe;cursor:pointer;user-select:none}
.q b{font-size:14px}.q i{font-style:normal;font-size:10px;font-weight:600;opacity:.72}
.q.ok{background:#e9f6ef;border-color:#1f7a4d;color:#1f7a4d}
.q.no{background:#fdecec;border-color:#b02a2a;color:#b02a2a}
.qrow{display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-size:21px;font-weight:800;color:var(--navy)}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.row:last-child{border-bottom:0}
.pbar{height:8px;background:#e8edf5;border-radius:6px;overflow:hidden;margin:8px 0}
.pbar span{display:block;height:100%;background:linear-gradient(90deg,#2e4f7a,#4a7ab0);border-radius:6px;transition:.3s}
.filter{display:flex;gap:8px;margin:0 0 12px;overflow-x:auto}
.f{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:20px;font-size:12.5px;white-space:nowrap;cursor:pointer}
.f.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.wk{border-left:3px solid var(--navy);padding:10px 12px;margin-bottom:10px;background:#fff;border-radius:0 12px 12px 0}
.wk h4{margin:0 0 4px;font-size:14px}
.wk .l{font-size:13px;color:#3a4a5e;margin:2px 0}
.wk .t{font-size:12px;color:var(--mut)}
.wk.r2{border-color:#b7791f}.wk.r3{border-color:#2f7d4f}.wk.r4{border-color:#b02a2a}
.pl{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #eef2f7;font-size:13.5px}
.pl .n{color:var(--mut);font-size:12px;width:30px;flex:0 0 auto}
.pl .t2{flex:1}
.pl .f2{color:var(--mut);font-size:12px;font-weight:400}
.pl.done .t2{color:#9aa6b5}
.dots{display:flex;gap:3px;margin-left:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:#dbe2ec;display:block}
.dots i.on{background:#2e7d4f}
table{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
th,td{padding:8px 6px;border-bottom:1px solid #eef2f7;text-align:left;vertical-align:top;word-break:break-word}
th{color:var(--mut);font-weight:600;font-size:11.5px}
.badge{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11px;background:#eef3fa;color:#2e4f7a}
.badge.j{background:#fff4e0;color:#8a5a00}
.badge.z{background:#fdecec;color:#9b2020}
.bars{display:flex;align-items:flex-end;gap:5px;height:76px;margin:10px 0 4px}
.bars div{flex:1;background:#dbe5f2;border-radius:5px 5px 0 0;min-height:3px}
.bars div.h{background:linear-gradient(180deg,#4a7ab0,#2e4f7a)}
.empty{color:var(--mut);text-align:center;padding:22px 0;font-size:13.5px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.kpi div{background:#fff;border-radius:14px;padding:12px 8px;text-align:center;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.kpi b{display:block;font-size:22px;color:var(--navy)}
.kpi span{font-size:11.5px;color:var(--mut)}
.mi{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px;background:#fff}
.mi .q{font-size:13.5px;line-height:1.55;color:#1c2430;background:none;border:0;height:auto;display:block;text-align:left;cursor:default}
.mi .q b{color:var(--red)}
.mi .fx{font-size:12.5px;color:#3a4a5e;margin-top:5px}
.mi .top{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--mut);margin-bottom:5px}
.mi .top .sp{margin-left:auto}
.gi{display:flex;gap:9px;padding:9px 0;border-bottom:1px dashed #eef2f7;align-items:flex-start}
.gi:last-child{border-bottom:0}
.gb{flex:0 0 auto;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;margin-top:2px}
.g1{background:#fdecec;color:#9b2020}
.g2{background:#fff4e0;color:#8a5a00}
.g3{background:#eef1f6;color:#6b7787}
.gt{font-size:13.5px;line-height:1.5}
.gt b{font-weight:600}
.kps{display:flex;flex-wrap:wrap;gap:7px;font-size:12.5px}
.kpchip{border:1px solid #e7c9c9;background:#fff7f7;color:#9b2020;border-radius:20px;padding:3px 10px;cursor:pointer;font-size:12px}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:13.5px/1.5 inherit;background:#fbfcfe;margin-bottom:8px}
select.inp{appearance:auto}
.foot{text-align:center;font-size:11.5px;color:#9aa6b5;padding:18px 0 6px}
@media(max-width:420px){.count b{font-size:44px}}
</style>
</head>
<body>
<div class="hero"><div class="wrap">
  <div class="hero-top"><span class="slogan">叶家宏 · 无论如何今年一定上岸</span><span class="streak" id="streak">🔥 0 天</span></div>
  <div class="count"><b id="cd">—</b><span>天</span></div>
  <div class="count-label">距 2027 社招笔试（7/11）</div>
  <div class="chips" id="chips"></div>
</div></div>

<div class="wrap">
  <div class="sec on" id="s-today">
    <div class="datebar"><input type="date" id="date"><button class="btn" id="todayBtn">今天</button></div>
    <div id="todayBox"></div>
    <div class="card">
      <h3><span class="dot"></span>今天记一笔<span class="tag">自动保存</span></h3>
      <textarea class="note" id="note" placeholder="今天学了什么、错在哪、明天先做什么（三行就够）"></textarea>
    </div>
  </div>

  <div class="sec" id="s-plan">
    <div class="filter" id="pf"></div>
    <div id="planBox"></div>
  </div>

  <div class="sec" id="s-poem">
    <div class="card">
      <h3><span class="dot"></span>135 篇 · 三轮背诵<span class="tag" id="ptag">0 / 135</span></h3>
      <div class="pbar"><span id="pbar" style="width:0%"></span></div>
      <div class="small" id="pdue"></div>
    </div>
    <div class="filter" id="gf"></div>
    <div class="card" id="poemBox"></div>
  </div>

  <div class="sec" id="s-mist">
    <div class="card">
      <h3><span class="dot" style="background:#b02a2a"></span>记一道错题</h3>
      <input class="inp" id="mq" placeholder="题目（写关键词就够，不用抄全题）">
      <select class="inp" id="mkp">
        <option>字音</option><option>字形</option><option>熟语</option><option>病句</option><option>标点</option><option>修辞</option><option>语言表达</option><option>现代汉语</option><option>现代文阅读</option><option>诗歌鉴赏</option><option>文言文</option><option>文学史</option><option>写作</option><option>课标</option><option>教学设计与案例</option><option>教育学</option><option>心理学</option><option>教育法规</option><option>教师职业道德</option><option>新课改</option><option>其他</option>
      </select>
      <select class="inp" id="mc">
        <option>概念不清</option><option>看错题</option><option>没背下来</option><option>想多了</option><option>粗心手滑</option>
      </select>
      <input class="inp" id="mf" placeholder="正确思路（一句话，写给自己看）">
      <div class="btns"><button class="btn" id="madd">加入错题集</button><span class="small" id="mtip"></span></div>
    </div>
    <div class="card"><h3><span class="dot" style="background:#b02a2a"></span>按知识点归类<span class="tag">点标签筛选</span></h3><div id="mstat" class="kps"></div></div>
    <div class="filter" id="mf2"></div>
    <div id="mistBox"></div>
  </div>

  <div class="sec" id="s-mat">
    <div class="filter" id="matf">
      <div class="f on" data-v="mat">材料索引</div>
      <div class="f" data-v="grade">背诵分级</div>
    </div>
    <div class="card" id="matCard">
      <h3><span class="dot"></span>材料索引</h3>
      <table id="matTable"></table>
    </div>
    <div class="card" id="gradeCard" style="display:none">
      <h3><span class="dot" style="background:#b02a2a"></span>背什么、掌握什么<span class="tag" id="gtag"></span></h3>
      <div class="small" style="margin-bottom:10px">必背＝要能默写出来；掌握＝认识、能判断、会用；了解＝眼熟即可。</div>
      <div id="gradeBox"></div>
    </div>
  </div>

  <div class="sec" id="s-stat">
    <div class="kpi" id="kpi"></div>
    <div class="small" id="qline" style="margin:-6px 0 12px 2px"></div>
    <div class="card">
      <h3><span class="dot"></span>最近 14 天</h3>
      <div class="bars" id="bars"></div>
      <div class="small">左起 14 天前 → 昨天。柱高 = 当天完成度。</div>
    </div>
    <div class="card">
      <h3><span class="dot"></span>关键节点</h3>
      <div id="miles"></div>
    </div>
    <div class="card">
      <h3><span class="dot"></span>数据</h3>
      <div class="btns">
        <button class="btn" id="repBtn">生成本周复盘</button>
        <button class="btn" id="expBtn">导出进度</button>
        <button class="btn" id="impBtn">导入进度</button>
        <button class="btn miss" id="resetBtn">清空</button>
      </div>
      <div id="repBox" style="display:none;margin-top:10px">
        <textarea class="note" id="repTxt" readonly style="min-height:200px;font-size:12.5px"></textarea>
        <div class="btns"><button class="btn" id="copyRep">复制这段，发给老师</button></div>
      </div>
      <div class="small" style="margin-top:8px">进度存在本机浏览器里，换设备用“导出/导入”搬。</div>
    </div>
  </div>
  <div class="foot">34 周 · 238 天　|　死命令不打勾，不算今天　|　<span>v20261105</span></div>
</div>

<div class="tabs">
  <div class="tab on" data-s="today"><i>◎</i>今日</div>
  <div class="tab" data-s="plan"><i>▤</i>计划</div>
  <div class="tab" data-s="poem"><i>□</i>背诵</div>
  <div class="tab" data-s="mist"><i>✕</i>错题</div>
  <div class="tab" data-s="mat"><i>▣</i>材料</div>
  <div class="tab" data-s="stat"><i>◔</i>数据</div>

  $('#chips').innerHTML = ms.map(m => '<span class="chip">'+m.t+' <b>'+cdTo(m.d)+'</b> 天</span>').join('');
  let st = 0, cur = new Date();
  for(let i=0;i<400;i++){
    const k = fmt(cur), v = S.days[k];
    if(v && (v.s==='done'||v.s==='part')) st++;
    else if(i>0) break;
    cur = new Date(cur.getTime()-DAYMS);
  }
  $('#streak').textContent = '🔥 连续 ' + st + ' 天';
}

function poemState(p){
  const k = p.seg + p.no;
  return S.poems[k] || {r:0};
}
function poemDue(p){
  const s = poemState(p);
  if(!s.r) return true;
  return !s.n || s.n <= today();
}
let CUR = today();
function quota(){ const n = daysBetween(D.start, CUR); return Math.max(0, (n+1)*6); }
function duePoems(){
  const q = quota();
  return D.poems.filter((p,i)=> i < q && poemDue(p));
}
function advance(p){
  const k = p.seg + p.no, s = poemState(p);
  const r = Math.min((s.r||0)+1, 5);
  S.poems[k] = {r:r, n: addDays(today(), ROUND_ADD[r-1]||30), last: today()};
  save();
}

let qtimer = null, qleft = 1500;
function stopT(){ if(qtimer){ clearInterval(qtimer); qtimer = null; } }
function fmtT(s){ return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function renderQuiz(ds, day){
  stopT(); qleft = 1500;
  const card = document.getElementById('quizCard');
  const st = S.days[ds] = S.days[ds] || {};
  if(!st.q) st.q = {r:[]};
  if(!st.q.r) st.q.r = [];
  $('#qSrc').innerHTML = '<b>语文 6 题</b>　选择2 · 默写1 · 简答1 · 鉴赏1 · 阅读1　← ' + day.yw
    + '<br><b>教基 4 题</b>　选择3 · 辨析1　← ' + day.jf;
  const g = $('#qGrid'); g.innerHTML = '';
  const refresh = () => {
    const rr = S.days[ds].q.r || [];
    const rt = rr.filter(x=>x===1).length, bad = rr.filter(x=>x===2).length;
    $('#qScore').textContent = (rt+bad) ? ('对 '+rt+'　错 '+bad) : '未做';
    $('#qTip').textContent = (rt+bad) ? '点格子可改判' : '做完一题点一格';
  };
  for(let i=0;i<10;i++){
    const el = document.createElement('div');
    const v = S.days[ds].q.r[i] || 0;
    el.className = 'q' + (v===1?' ok':v===2?' no':'');
    el.innerHTML = '<b>'+(i+1)+'</b><i>'+QT[i]+'</i>';
    el.onclick = () => {
      const c = S.days[ds].q.r[i] || 0;
      S.days[ds].q.r[i] = c===0?1:c===1?2:0;
      el.className = 'q' + (S.days[ds].q.r[i]===1?' ok':S.days[ds].q.r[i]===2?' no':'');
      save(); refresh();
    };
    g.appendChild(el);
  }
  $('#qTimer').textContent = fmtT(qleft);
  refresh();
  const btn = $('#qStart');
  btn.textContent = '开始计时';
  btn.onclick = () => {
    if(qtimer){ stopT(); btn.textContent='开始计时'; return; }
    btn.textContent = '暂停';
    qtimer = setInterval(()=>{ qleft--; if(qleft<=0){ qleft=0; stopT(); btn.textContent='开始计时'; } $('#qTimer').textContent = fmtT(qleft); },1000);
  };
  $('#qReset').onclick = () => { stopT(); S.days[ds].q = {r:[]}; save(); renderQuiz(ds, day); };
}

// ---- 统计 ----
function renderStat(){
  const keys = Object.keys(S.days);
  const done = keys.filter(k=>S.days[k].s==='done').length;
  const part = keys.filter(k=>S.days[k].s==='part').length;
  const passed = D.days.filter(d=>d.d<=today()).length || 1;
  const rate = Math.round((done + part*0.5)/passed*100);
  const poems = D.poems.filter(p=>(S.poems[p.seg+p.no]||{}).r>=3).length;
  $('#kpi').innerHTML = '<div><b>'+rate+'%</b><span>完成率</span></div><div><b>'+done+'</b><span>完成天</span></div><div><b>'+poems+'</b><span>背会篇</span></div>';
  const qd = keys.filter(k=>S.days[k].q && (S.days[k].q.r||[]).length);
  let qr = 0; qd.forEach(k=>qr += (S.days[k].q.r||[]).filter(x=>x===1).length);
  const qn = qd.length*10;
  $('#qline').textContent = '每日10题：已做 '+qn+' 题，答对 '+qr+' 题，正确率 '+(qn?Math.round(qr/qn*100):0)+'%　|　错题集：'+S.mist.length+' 道，未掌握 '+S.mist.filter(m=>!m.ok).length+' 道';
  const arr = [];
  for(let i=13;i>=0;i--){
    const d = new Date(Date.now()-i*DAYMS), k = fmt(d), st = S.days[k];
    let v = 0;
    if(st){ v = st.s==='done'?1:st.s==='part'?0.5:0; if(st.cmd && st.cmd.filter(x=>x).length===3) v = Math.max(v,1); }
    arr.push(v);
  }
  const mx = Math.max(1, ...arr);
  $('#bars').innerHTML = arr.map(v=>'<div class="'+(v>0?'h':'')+'" style="height:'+Math.max(3,v/mx*100)+'%"></div>').join('');
  $('#miles').innerHTML = D.miles.map(m=>{
    const d = cdTo(m.d);
    return '<div class="row"><span>'+m.d.slice(5)+'　'+m.t+'</span><b style="color:'+(d<0?'#9aa6b5':d<60?'#b02a2a':'#1f3a5f')+'">'+(d<0?'已过':'还有 '+d+' 天')+'</b></div>';
  }).join('');
}

    const q = (st.q && st.q.r) ? st.q.r : [];
    const rt = q.filter(x=>x===1).length, bt = q.filter(x=>x===2).length;
    if(rt+bt){ qdays++; qn += rt+bt; qr += rt; }
    lines.push(d.d.slice(5) + ' ' + (s==='done'?'完成':s==='part'?'部分':s==='miss'?'没做':'未记')
      + '｜死命令'+c+'/3' + ((rt+bt) ? ('｜10题 '+rt+'/'+(rt+bt)) : '')
      + ((st.note||'').trim() ? ('｜' + (st.note||'').replace(/\s+/g,' ').slice(0,60)) : ''));
  });
  const newPoems = Object.keys(S.poems).filter(k => (S.poems[k].last||'') >= start).length;
  const poemDone = D.poems.filter(p => (S.poems[p.seg+p.no]||{}).r >= 3).length;
  const wkMist = S.mist.filter(m => (m.d||'') >= start);
  const kpc = {}; S.mist.filter(m=>!m.ok).forEach(m=>{ const k=m.kp||'其他'; kpc[k]=(kpc[k]||0)+1; });
  const topk = Object.keys(kpc).sort((a,b)=>kpc[b]-kpc[a]).slice(0,3).map(k=>k+'('+kpc[k]+')').join('、') || '无';
  const t = '【本周复盘】' + start.slice(5) + '—' + end.slice(5) + '\n'
    + '打卡：完成 ' + done + ' 天，部分 ' + part + ' 天，没做 ' + miss + ' 天，未记 ' + (rows.length-done-part-miss) + ' 天\n'
    + '死命令：3/3 有 ' + cmdFull + ' 天（共 ' + rows.length + ' 天）\n'
    + '10题：做了 ' + qdays + ' 天，共 ' + qn + ' 题，对 ' + qr + ' 题，正确率 ' + (qn?Math.round(qr/qn*100):0) + '%\n'
    + '背诵：本周新背 ' + newPoems + ' 篇，累计 ' + poemDone + '/135\n'
    + '错题：本周新增 ' + wkMist.length + ' 道，未掌握 ' + S.mist.filter(m=>!m.ok).length + ' 道；集中：' + topk + '\n'
    + '每日：\n' + (lines.length ? lines.join('\n') : '（本周还没有记录）') + '\n'
    + '下周只改一件事：';
  $('#repTxt').value = t;
  $('#repBox').style.display = 'block';
  $('#repTxt').scrollIntoView({behavior:'smooth', block:'center'});
};
$('#copyRep').onclick = () => {
  const el = $('#repTxt');
  el.select(); el.setSelectionRange(0, 99999);
  try { document.execCommand('copy'); } catch(e){}
  if(navigator.clipboard){ navigator.clipboard.writeText(el.value).catch(()=>{}); }
  $('#copyRep').textContent = '已复制，去粘贴';
  setTimeout(()=>{ $('#copyRep').textContent = '复制这段，发给老师'; }, 1800);
};
$('#expBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'yq2027-进度.json'; a.click();
};
$('#impBtn').onclick = () => {
  const inp = document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange = () => { const f=inp.files[0]; if(!f) return; const r=new FileReader();
    r.onload = () => { try{ S = JSON.parse(r.result); S.days=S.days||{}; S.poems=S.poems||{}; S.mist=S.mist||[]; save(); location.reload(); }catch(e){ alert('文件格式不对'); } };
    r.readAsText(f); };
  inp.click();
};
$('#resetBtn').onclick = () => { if(confirm('清空所有打卡、背诵、错题记录？')){ S={days:{},poems:{},mist:[]}; save(); location.reload(); } };

const q = new URLSearchParams(location.search);
$('#date').value = q.get('d') || today();
if(q.get('mv')) mv = q.get('mv');
if(q.get('tab')){ const t=document.querySelector('.tab[data-s="'+q.get('tab')+'"]'); if(t) t.click(); }
document.getElementById('ver').textContent='v'+ (D.build||'').replace(/-/g,'');
header(); renderToday(); renderPlan(); renderPoems(); renderMist(); renderMats(); renderStat();
</script>
</body>
</html>
